<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css?v=1.0">
</head>
<body>

    <div class="frame flex flex-col items-center justify-start p-4 pt-14">
    
        <div class="wrapper flex flex-col items-center">
            <div class="circle-container flex items-center justify-between">
                <div class="arrow">
                    <img src="images/left-arrow.png" alt="left-arrow" class="image left-arrow">
                </div>
                <div class="circle -mt-4">
                    <img src="images/inop6.jpg" alt="inop6" class="inop6-image">
                </div>
                <div class="arrow">
                    <img src="images/right-arrow.png" alt="right-arrow" class="image right-arrow">
                </div>
            </div>                 
            <p class="welcome-text">Newbie</p>
            
            <div class="bordered-text mt-4">
                <p class="additional-text -mt-4">
                    Собери 2 000 Impulse </br > чтобы перейти в эту лигу. </br > Стоимость перехода 1 IMPULSE.
                </p>
                <div class="nickname-container mt-4">
                    <div class="circle1">
                        <img src="images/inop6.jpg" alt="inop6" class="inop6-image">
                    </div>
                    <div class="nickname-text">
                        <p class="start-listening-text">МОЙ НИКНЕЙМ</p>
                        <p class="border-text">2888 Impulse</p>
                    </div>
                    <p class="special-text">#1999</p>
                </div>      

                <div class="claim-container">
                    <button class="claim-btn">Move</button>
                </div>
            </div>

            <div class="bordered2-text mt-4">
                <div class="nickname2-container">
                    <div class="circle1">
                        <img src="images/inop6.jpg" alt="inop6" class="inop6-image">
                    </div>
                    <div class="nickname2-text">
                        <p class="start2-listening-text">dubai</p>
                        <p class="border2-text">15 000 Impulse</p>
                    </div>
                    <p class="special2-text">#1</p>
                </div>      
            </div>

            <div class="top-buttons">
                <button class="icon-button menu-button">
                    <img src="images/menu.png" alt="Menu" class="icon">
                </button>
        
                <button class="icon-button star-button">
                    <a href="#" class="wallet-item" id="wallet">
                    <img src="images/vector.png" alt="Star" class="icon">
                    </a>
                </button>        
            </div>
            
            <footer class="footer">
                <a href="#" class="footer-item" id="radio">
                    <img src="images/RADIO%20ICON.png" alt="RADIO ICON">
                    <span>Radio</span>
                </a>
                
                <a href="#" class="footer-item" id="stations">
                    <img src="images/stations.png" alt="Stations">
                    <span>Stations</span>
                </a>
                
                <a href="#" class="footer-item" id="friends">
                    <img src="images/raphael_people.png" alt="Friends">
                    <span>Friends</span>
                </a>
                
                <a href="#" class="footer-item" id="tasks">
                    <img src="images/Group.png" alt="Tasks">
                    <span>Tasks</span>
                </a>
                
                <a href="#" class="footer-item" id="wallet">
                    <img src="images/pap.png" alt="Wallet" class="pap-img">
                    <img src="images/music.png" alt="Music" class="music-img">
                    <span>Music</span>
                </a>        
            </footer>
            
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
