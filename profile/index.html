<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="frame flex flex-col items-center justify-start p-4 pt-20">
        <div class="knop">
            <div class="station-buttons">
                <button id="all-btn" class="station-btn active">Artists</button>
                <button id="fav-btn" class="station-btn inactive">Favorites</button>
            </div>            
        </div>

        <div class="search-container">
            <input type="text" id="station-search" class="station-search" placeholder="Artists, album or track name...">
            <img src="images/search.png" class="search-icon" alt="Search">
        </div>

        <ul id="all-stations" class="station-list">
        <div class="container flex flex-wrap -mt-2">
            <div class="photo-container">
                <p class="photo2-text">Олег Кензов</p>
                <div class="circle photo1-container">
                    <img src="images/photo1.jpg" alt="photo1" class="photo1-image">
                </div>
                <div class="button-container">
                    <button class="photo-button"><span>Новая песня</span></button>
                    <button class="photo-button"><span>Альбомы</span></button>
                    <button class="photo-button"><span>Донат</span></button>                    
                </div>
                <div class="back-wrapper">
                    <img src="images/back.png" class="back-icon" alt="back">
                    <img src="images/back1.png" class="back1-image" alt="back1">
                </div>
            </div>
                              
            <img src="images/poloska.png" class="poloska-icon" alt="poloska">
            <ul id="fav-stations" class="station-list">
                <li class="station-item header">
                    <div class="station-name">Name</div>
                    <div class="station-rating">Rating</div>
                    <div class="station-favourites">In favourites</div>
                </li>
                <li class="station-item">
                    <img src="images/music1.png" class="icon-left" alt="Music">
                    <div class="station-name">Белый снег</div>
                    <div class="station-rating"><span>5.0</span></div>
                    <div class="station-favourites">10254</div>
                </li>
                <li class="station-item">
                    <img src="images/music1.png" class="icon-left" alt="Music">
                    <div class="station-name">Гэй наливай</div>
                    <div class="station-rating"><span>5.0</span></div>
                    <div class="station-favourites">9630</div>
                </li>
                <li class="station-item">
                    <img src="images/music1.png" class="icon-left" alt="Music">
                    <div class="station-name">Жигули</div>
                    <div class="station-rating"><span>4.9</span></div>
                    <div class="station-favourites">2300</div>
                </li>
            </ul>            
        </div>
        </ul>

    <div class="top-buttons">
        <button class="icon-button menu-button">
            <img src="images/menu.png" alt="Menu" class="icon">
        </button>

        <button class="icon-button star-button">
            <a href="#" class="wallet-item" id="wallet">
            <img src="images/vector.png" alt="Star" class="icon">
            </a>
        </button>        
    </div>

    <footer class="footer" id="footer">
        <a href="#" class="footer-item" id="player">
            <img src="images/naush.png" alt="Player">
            <span>Player</span>
        </a>
        <a href="#" class="footer-item" id="wallet">
            <img src="images/pap.png" alt="Wallet" class="pap-img">
            <img src="images/music.png" alt="Music" class="music-img">
            <span>Catalog</span>
        </a>
        <a href="#" class="footer-item" id="Favorites">
            <img src="images/kvadr.png" alt="Favorites" class="fav-img">
            <img src="images/littleheart.png" alt="littleheart" class="little1-img">
            <img src="images/littleheart.png" alt="littleheart" class="little2-img">
            <span>Favorites</span>
        </a>        
        <a href="#" class="footer-item active" id="profile">
            <img src="images/profile.png" alt="profile">
            <span>Profile</span>
        </a>
    </footer>
    </div>
    <script src="script.js"></script>
</body>
</html>
